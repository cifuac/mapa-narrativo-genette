<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lámina interactiva con los componentes de la narración según Figuras III de Gérard Genette.">
<title>Mapa narrativo de Genette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Lámina 16:9 de 1600×900 escalada a la pantalla: plano imaginario arriba (eje narración → relato → historia), plano real abajo. Todo elemento abre una ficha con definición, tipos, ejemplos y relaciones. */
:root{
  --page:#E6EAF0;
  --stage:#FFFFFF;
  --ink:#14213A;
  --ink-2:#4A5770;
  --ink-3:#7E899D;
  --line:#BFC8D6;
  --imag:#F2F5FA;  --imag-dot:#D9E0EB;
  --real:#F6F3EE;  --real-dot:#E5DED2;

  --voz:#1F5FA6;    --voz-tint:#E5EEF8;   --voz-line:#B7CDE6;
  --tiempo:#6B44B6; --tiempo-tint:#F0EAFA;
  --modo:#0C7A70;   --modo-tint:#DFF2EF;
  --real-c:#8A5A12; --real-tint:#F4E8D4;  --real-line:#DCC9A8;
  --lazo:#2E7A48;   --lazo-tint:#E2F1E6;
  --plano:#B23A2E;  --plano-tint:#FBEAE8;
  --neutral-tint:#EDF0F5;

  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--c, var(--voz));outline-offset:3px}

.viewport{
  position:fixed;inset:0;
  padding-top:max(14px, env(safe-area-inset-top, 0px));
  padding-bottom:max(14px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.stage{
  position:absolute;left:50%;top:50%;
  width:1600px;height:900px;
  transform:translate(-50%,-50%) scale(var(--s,.5));
  transform-origin:center center;
  background:var(--stage);
  border-radius:24px;
  box-shadow:0 1px 2px rgba(20,33,58,.06), 0 30px 70px -20px rgba(20,33,58,.28);
  overflow:hidden;
}
.el{position:absolute;z-index:2}
.lines{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;z-index:1}
.panel{position:absolute;border-radius:22px;z-index:0}
.panel-imag{background-color:var(--imag);background-image:radial-gradient(var(--imag-dot) 1.1px, transparent 1.6px);background-size:22px 22px;border:1px solid #E1E7F0}
.panel-real{background-color:var(--real);background-image:radial-gradient(var(--real-dot) 1.1px, transparent 1.6px);background-size:22px 22px;border:1px solid #ECE5DA}
.glow{position:absolute;z-index:1;pointer-events:none;background:radial-gradient(closest-side, rgba(31,95,166,.17), rgba(31,95,166,0))}

/* Encabezado */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.title{font-family:var(--serif);font-weight:400;font-size:54px;line-height:1;letter-spacing:-.01em;margin:0;color:var(--ink)}
.title em{font-style:italic;color:var(--voz)}
.legend{display:flex;justify-content:flex-end;gap:8px}
.legend button{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:var(--stage);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);transition:background .15s,border-color .15s}
.legend button:hover{border-color:var(--c);background:var(--t)}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.hint{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}
.hint svg{width:18px;height:18px;color:var(--voz)}

/* Etiquetas de plano */
.plano{display:grid;gap:1px;--c:var(--plano)}
.plano b{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--plano)}
.plano span{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-3)}
.plano:hover b{text-decoration:underline;text-underline-offset:3px}

/* Nodos */
.node{
  display:flex;align-items:center;gap:14px;padding:0 20px;
  border-radius:18px;background:var(--stage);
  border:1.5px solid var(--voz-line);
  box-shadow:0 1px 0 rgba(20,33,58,.04), 0 10px 24px -14px rgba(20,33,58,.35);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  --c:var(--voz);
}
.node:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 1px 0 rgba(20,33,58,.04), 0 18px 30px -16px rgba(20,33,58,.45)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--voz-tint);color:var(--voz)}
.ic svg{width:25px;height:25px}
.nm{display:block;font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.005em}
.sb{display:block;font-size:14px;color:var(--ink-3);margin-top:4px;line-height:1.2}
.node.hero{background:var(--voz);border-color:var(--voz);color:#FFFFFF;box-shadow:0 1px 0 rgba(20,33,58,.04), 0 16px 34px -14px rgba(31,95,166,.6)}
.node.hero .ic{background:rgba(255,255,255,.16);color:#FFFFFF}
.node.hero .sb{color:rgba(255,255,255,.82)}
.node.dark{background:var(--ink);border-color:var(--ink);color:#FFFFFF;border-radius:999px;padding:0 26px 0 12px;--c:var(--ink)}
.node.dark .ic{background:rgba(255,255,255,.12);color:#FFFFFF;border-radius:999px;width:38px;height:38px}
.node.dark .ic svg{width:21px;height:21px}
.node.dark .nm{font-size:24px}
.node.dark .sb{color:rgba(255,255,255,.7);margin-top:2px;font-size:13px}
.node.ink{border-color:#C9D1DD;--c:var(--ink)}
.node.ink .ic{background:var(--neutral-tint);color:var(--ink)}
.node.real{border-color:var(--real-line);--c:var(--real-c)}
.node.real .ic{background:var(--real-tint);color:var(--real-c);width:44px;height:44px;border-radius:13px}
.node.real .nm{font-size:20px}

.branch{display:grid;align-content:center;justify-items:center;gap:3px;text-align:center;border-radius:14px;background:var(--stage);border:1.5px solid var(--voz-line);box-shadow:0 8px 18px -14px rgba(20,33,58,.35);transition:transform .16s, border-color .16s;--c:var(--voz)}
.branch:hover{transform:translateY(-2px);border-color:var(--voz)}
.branch small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.branch b{font-size:15.5px;font-weight:700;color:var(--voz)}

/* Tarjetas de categoría */
.cat{background:var(--stage);border-radius:18px;box-shadow:0 10px 24px -16px rgba(20,33,58,.35)}
.cat-voz{border:1.5px solid var(--voz);--c:var(--voz);--t:var(--voz-tint);padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.cat-tm{border:1.5px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
.half{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
/* La divisoria continúa el eje de la tríada: mismo color y misma x (800) que la línea del SVG. */
.cat-tm::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 1px);width:2px;background:#9AA6B8;pointer-events:none}
.c-tiempo{--c:var(--tiempo);--t:var(--tiempo-tint)}
.c-modo{--c:var(--modo);--t:var(--modo-tint)}
.c-voz{--c:var(--voz);--t:var(--voz-tint)}
.cat-head{display:flex;align-items:baseline;gap:10px;align-self:flex-start}
.cat-name{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.cat-name svg{width:17px;height:17px;transform:translateY(2px)}
.cat-q{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-2)}
.cat-head:hover .cat-name{text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:nowrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--t);color:var(--c);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:var(--c);color:#FFFFFF}

/* Tarjetas de apoyo */
.aux{border-radius:16px;background:var(--stage);border:1px solid #DCE2EB;padding:12px 16px 13px;display:grid;gap:7px;align-content:center;box-shadow:0 8px 20px -16px rgba(20,33,58,.3);transition:border-color .15s, transform .16s;--c:var(--ink)}
.aux:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.aux .k{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.rows{position:relative;display:grid;gap:5px}
.rows::before{content:"";position:absolute;left:3px;top:9px;bottom:9px;width:1.5px;background:var(--line)}
.rows .r{position:relative;display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-3)}
.rows .r b{color:var(--ink);font-weight:600}
.rows .d{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2.5px var(--stage)}
.vsrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.vsrow b{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}
.vsrow small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.vs-m b,.vs-m small{color:var(--modo)}
.vs-v b,.vs-v small{color:var(--voz)}
.neq{font-size:18px;line-height:.6;color:var(--plano);font-weight:700;padding-left:2px}

.tag{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;border-radius:999px;font-size:14px;font-weight:700;background:var(--stage);transition:background .15s}
.tag-neq{border:1.5px solid var(--ink-3);color:var(--ink-2);--c:var(--ink-2)}
.tag-neq:hover{background:var(--neutral-tint)}
.tag-neq i{font-style:normal;font-size:19px;line-height:1;color:var(--plano)}
.tag-lazo{border:1.5px dashed var(--lazo);color:var(--lazo);--c:var(--lazo)}
.tag-lazo:hover{background:var(--lazo-tint)}
.lbl{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-3);text-align:center;pointer-events:none}
.src{font-size:12.5px;color:var(--ink-3)}

.is-active{outline:3px solid var(--c, var(--voz));outline-offset:4px}

/* Ficha emergente */
.pop{
  position:fixed;z-index:50;left:0;top:0;
  width:min(430px, calc(100vw - 24px));
  max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain;
  background:#FFFFFF;border-radius:18px;
  box-shadow:0 0 0 1px rgba(20,33,58,.08), 0 30px 70px -16px rgba(20,33,58,.45);
  font-family:var(--sans);color:var(--ink);
  animation:popin .15s ease-out;
}
.pop:focus{outline:none}
@keyframes popin{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.node,.branch,.aux{transition:none}}
.pop-h{position:relative;padding:18px 56px 15px 22px;background:var(--pt);border-radius:18px 18px 0 0}
.pop-k{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--pc)}
.pop-k::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--pc)}
.pop h3{margin:7px 0 0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.02;letter-spacing:-.005em}
.pop .q{margin:5px 0 0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.2;color:var(--pc)}
.pop-b{padding:16px 22px 4px;display:grid;gap:14px}
.pop-b p{margin:0;font-size:15px;line-height:1.52;color:var(--ink-2)}
.pop-b i{font-style:italic}
.sl{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.pop ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pop li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.pop li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc);margin-top:.55em}
.pop li b{color:var(--ink);font-weight:700}
.box{border-radius:12px;padding:11px 13px 12px}
.box p{font-size:14.5px}
.box-ex{background:#F4F6FA}
.box-ojo{background:#FDF6F5;border:1.5px dashed #E4B9B3}
.box-ojo .sl{color:var(--plano)}
.formula{display:inline-block;font-family:var(--serif);font-size:22px;color:var(--pc);background:var(--pt);padding:4px 12px;border-radius:9px;margin-bottom:6px}
.pop-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 22px 18px;margin-top:12px;border-top:1px solid #E3E8EF}
.pop-f .vt{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.go{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;border:1px solid #D3DAE5;font-size:13px;font-weight:600;color:var(--ink-2);background:#FFFFFF;transition:border-color .15s, background .15s}
.go:hover{border-color:var(--pc);background:var(--pt);color:var(--ink)}
.go::after{content:"→";font-weight:500;color:var(--ink-3)}
.ref{flex-basis:100%;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.ref i{font-style:italic}
.pop .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.7)}
.pop .x:hover{background:#FFFFFF;color:var(--ink)}
.pop .x svg{width:18px;height:18px}
.tip{position:absolute;width:14px;height:14px;transform:rotate(45deg);z-index:-1}
.pop[data-side="below"] .tip{top:-7px;background:var(--pt)}
.pop[data-side="above"] .tip{bottom:-7px;background:#FFFFFF;box-shadow:1px 1px 0 rgba(20,33,58,.08)}
.pop[data-side="side"] .tip{display:none}

.rotate{position:fixed;left:50%;bottom:max(16px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:#FFFFFF;font-size:13.5px;padding:9px 16px;border-radius:999px;white-space:nowrap}
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">

  <div class="panel panel-imag" style="left:40px;top:136px;width:1520px;height:520px"></div>
  <div class="panel panel-real" style="left:40px;top:680px;width:1520px;height:184px"></div>
  <div class="glow" style="left:560px;top:270px;width:480px;height:220px"></div>

  <svg class="lines" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <marker id="a-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#14213A"/></marker>
      <marker id="a-lazo" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#2E7A48"/></marker>
    </defs>
    <path d="M800 214 V552" stroke="#9AA6B8" stroke-width="2" fill="none"/>
    <path d="M660 187 H362 Q330 187 330 219 V334" stroke="#9AA6B8" stroke-width="2" fill="none"/>
    <path d="M940 187 H1238 Q1270 187 1270 219 V334" stroke="#9AA6B8" stroke-width="2" fill="none"/>
    <circle cx="330" cy="334" r="3.5" fill="#9AA6B8"/>
    <circle cx="1270" cy="334" r="3.5" fill="#9AA6B8"/>
    <path d="M457 380 H649" stroke="#14213A" stroke-width="3" fill="none" marker-end="url(#a-ink)"/>
    <path d="M947 380 H1139" stroke="#14213A" stroke-width="3" fill="none" marker-end="url(#a-ink)"/>
    <path d="M330 426 V438 Q330 446 322 446 H261 Q253 446 253 454 V466" stroke="#9AA6B8" stroke-width="1.8" fill="none"/>
    <path d="M330 438 Q330 446 338 446 H399 Q407 446 407 454 V466" stroke="#9AA6B8" stroke-width="1.8" fill="none"/>
    <path d="M447 782 H677" stroke="#14213A" stroke-width="3" fill="none" marker-end="url(#a-ink)"/>
    <path d="M917 782 H1147" stroke="#14213A" stroke-width="3" fill="none" marker-end="url(#a-ink)"/>
    <path d="M330 744 V538" stroke="#7E899D" stroke-width="1.8" stroke-dasharray="5 6" fill="none"/>
    <path d="M1270 744 V432" stroke="#2E7A48" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-lazo)"/>
  </svg>

  <!-- Encabezado -->
  <div class="el eyebrow" style="left:64px;top:44px">Gérard Genette · <i>Figuras III</i></div>
  <h1 class="el title" style="left:62px;top:68px">Componentes de la <em>narración</em></h1>
  <div class="el legend" style="left:1000px;top:46px;width:536px">
    <button type="button" class="c-voz" data-k="voz" data-legend aria-haspopup="dialog"><span class="sw"></span>Voz</button>
    <button type="button" class="c-tiempo" data-k="tiempo" data-legend aria-haspopup="dialog"><span class="sw"></span>Tiempo</button>
    <button type="button" class="c-modo" data-k="modo" data-legend aria-haspopup="dialog"><span class="sw"></span>Modo</button>
  </div>
  <div class="el hint" style="left:1000px;top:90px;width:536px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9l5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="M5.1 8l-2.9-.8"/><path d="M14 4.1 12 6"/><path d="M6 12l-1.9 2"/></svg>
    Pulsa cualquier elemento para ver su ficha
  </div>

  <!-- Etiquetas de plano -->
  <button type="button" class="el plano" style="left:68px;top:594px" data-k="planoImag" aria-haspopup="dialog"><b>Plano imaginario</b><span>la ficción</span></button>
  <button type="button" class="el plano" style="left:68px;top:700px" data-k="planoReal" aria-haspopup="dialog"><b>Plano real</b><span>escritura y lectura</span></button>

  <!-- Distinción clave -->
  <button type="button" class="el aux" style="left:68px;top:156px;width:220px;height:118px" data-k="veHabla" aria-haspopup="dialog">
    <span class="k">No confundir</span>
    <span class="vsrow vs-m"><b>¿Quién ve?</b><small>modo</small></span>
    <span class="neq">≠</span>
    <span class="vsrow vs-v"><b>¿Quién habla?</b><small>voz</small></span>
  </button>

  <!-- Tríada -->
  <button type="button" class="el aux" style="left:1312px;top:156px;width:220px;height:118px" data-k="triada" aria-haspopup="dialog">
    <span class="k">La tríada de base</span>
    <span class="rows">
      <span class="r"><span class="d"></span><b>Narración</b> el acto</span>
      <span class="r"><span class="d"></span><b>Relato</b> el texto</span>
      <span class="r"><span class="d"></span><b>Historia</b> lo contado</span>
    </span>
  </button>

  <!-- Narración -->
  <button type="button" class="el node dark" style="left:660px;top:160px;width:280px;height:54px" data-k="narracion" aria-haspopup="dialog">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10v4M7 6v12M11 3v18M15 7v10M19 10v4"/></svg></span>
    <span><span class="nm">Narración</span><span class="sb">el acto de narrar</span></span>
  </button>

  <!-- Voz -->
  <div class="el cat cat-voz" style="left:556px;top:232px;width:488px">
    <button type="button" class="cat-head" data-k="voz" aria-haspopup="dialog">
      <span class="cat-name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>Voz</span>
      <span class="cat-q">¿quién habla?</span>
    </button>

  veHabla:{c:"plano", k:"Distinción clave", t:"¿Quién ve? ≠ ¿quién habla?", q:"El error que Genette quiere corregir",

  historia:{c:"ink", k:"La tríada", t:"Historia", q:"¿Qué se cuenta?",

const stage = document.getElementById("stage");
const vp = document.querySelector(".viewport");
const pop = document.getElementById("pop");
const tip = document.getElementById("popTip");
const rotate = document.getElementById("rotate");
let current = null;

function fit(){
  const cs = getComputedStyle(vp);
  const w = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  stage.style.setProperty("--s", Math.max(.1, Math.min(w / 1600, h / 900)));
  rotate.hidden = !(innerWidth < innerHeight && innerWidth < 760);
  if (current) place(current);
}

function fmt(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*(.+?)\*/g,"<i>$1</i>");
}
function list(items){
  return "<ul>" + items.map(([a,b]) => "<li><span><b>" + fmt(a) + ":</b> " + fmt(b) + "</span></li>").join("") + "</ul>";
}

function fill(d){
  const [pc, pt] = C[d.c];
  pop.style.setProperty("--pc", pc);
  pop.style.setProperty("--pt", pt);
  document.getElementById("popK").textContent = d.k;
  document.getElementById("popT").textContent = d.t;
  const q = document.getElementById("popQ");
  q.hidden = !d.q; q.textContent = d.q || "";
  let h = "";
  if (d.p) h += "<p>" + fmt(d.p) + "</p>";
  if (d.f) h += "<div><span class=\"formula\">" + fmt(d.f) + "</span></div>";
  if (d.l) h += "<div>" + (d.ls ? "<p class=\"sl\">" + fmt(d.ls) + "</p>" : "") + list(d.l) + "</div>";
  if (d.l2) h += "<div>" + (d.ls2 ? "<p class=\"sl\">" + fmt(d.ls2) + "</p>" : "") + list(d.l2) + "</div>";
  if (d.ej) h += "<div class=\"box box-ex\"><p class=\"sl\">En Genette</p><p>" + fmt(d.ej) + "</p></div>";
  if (d.ojo) h += "<div class=\"box box-ojo\"><p class=\"sl\">No confundir</p><p>" + fmt(d.ojo) + "</p></div>";
  document.getElementById("popB").innerHTML = h;
  let f = "";
  if (d.rel && d.rel.length) f += "<span class=\"vt\">Ver también</span>" + d.rel.filter(k => INFO[k]).map(k => "<button type=\"button\" class=\"go\" data-go=\"" + k + "\">" + fmt(INFO[k].t) + "</button>").join("");
  if (d.r) f += "<span class=\"ref\"><i>Figuras III</i>, " + fmt(d.r) + "</span>";
  const foot = document.getElementById("popF");
  foot.innerHTML = f; foot.hidden = !f;
}

function anchorFor(k){
  return document.querySelector(".stage [data-k=\"" + k + "\"]:not([data-legend])") || document.querySelector("[data-k=\"" + k + "\"]");
}

function place(btn){
  const r = btn.getBoundingClientRect();
  const m = 12, gap = 14, vw = innerWidth, vh = innerHeight;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left, top, side;
  if (r.bottom + gap + ph <= vh - m) { side = "below"; top = r.bottom + gap; }
  else if (r.top - gap - ph >= m) { side = "above"; top = r.top - gap - ph; }
  else { side = "side"; }
  if (side === "side") {
    top = Math.max(m, Math.min(r.top + r.height / 2 - ph / 2, vh - m - ph));
    if (r.right + gap + pw <= vw - m) left = r.right + gap;
    else if (r.left - gap - pw >= m) left = r.left - gap - pw;
    else left = (vw - pw) / 2;
  } else {
    left = Math.max(m, Math.min(r.left + r.width / 2 - pw / 2, vw - m - pw));
    tip.style.left = Math.max(18, Math.min(r.left + r.width / 2 - left - 7, pw - 32)) + "px";
  }
  pop.dataset.side = side;
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}

function openPop(btn){
  if (!btn) return;
  const d = INFO[btn.dataset.k];
  if (!d) return;
  if (current) { current.classList.remove("is-active"); current.setAttribute("aria-expanded","false"); }
  current = btn;
  fill(d);
  pop.hidden = false;
  pop.scrollTop = 0;
  pop.style.animation = "none"; void pop.offsetWidth; pop.style.animation = "";
  place(btn);
  btn.classList.add("is-active");
  btn.setAttribute("aria-expanded","true");
  pop.focus({preventScroll:true});
}

function closePop(returnFocus){
  if (!current) return;
  const btn = current;
  current = null;
  pop.hidden = true;
  btn.classList.remove("is-active");
  btn.setAttribute("aria-expanded","false");
  if (returnFocus) btn.focus({preventScroll:true});
}

document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-expanded","false"));

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { openPop(anchorFor(go.dataset.go)); return; }
  if (e.target.closest("#popX")) { closePop(true); return; }
  const b = e.target.closest("[data-k]");
  if (b) { if (current === b) closePop(false); else openPop(b); return; }
  if (!pop.contains(e.target)) closePop(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(true); });
addEventListener("resize", fit);
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) place(current); });
</script>
