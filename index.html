<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lámina interactiva con los componentes de la narración según Figuras III de Gérard Genette.">
<title>Mapa narrativo de Genette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Lámina 16:9 (1600×900) escalada a la pantalla. La obra escrita es un libro que contiene la ficción;
   autor y lector quedan fuera, frente a sus contrapartes. Eje vertical: la tríada narración → relato → historia. */
:root{
  --page:#E3E7EE;
  --stage:#F8F9FB;
  --paper:#FFFFFF;
  --ink:#14213A;
  --ink-2:#465470;
  --ink-3:#7C879B;
  --line:#A7B1C2;
  --hair:#E3E8EF;
  --edge:#D3DBE7;
  --fic:#EEF2F8;  --fic-dot:#D5DDE9;

  --voz:#1F5FA6;    --voz-tint:#E5EEF8;
  --tiempo:#6B44B6; --tiempo-tint:#F0EAFA;
  --modo:#0C7A70;   --modo-tint:#DFF2EF;
  --real:#8A5A12;   --real-tint:#F5EBDA;  --real-edge:#E2D2B6;
  --lazo:#2E7A48;   --lazo-tint:#E2F1E6;
  --plano:#B23A2E;  --plano-tint:#FBEAE8;
  --neutral-tint:#EDF0F5;

  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--c, var(--voz));outline-offset:3px}

.viewport{
  position:fixed;inset:0;
  padding-top:max(10px, env(safe-area-inset-top, 0px));
  padding-bottom:max(10px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.stage{
  position:absolute;left:50%;top:50%;
  width:1600px;height:900px;
  transform:translate(-50%,-50%) scale(var(--s,.5));
  transform-origin:center center;
  background:var(--stage);
  border-radius:24px;
  box-shadow:0 1px 2px rgba(20,33,58,.06), 0 30px 70px -22px rgba(20,33,58,.3);
  overflow:hidden;
}
html.is-fs, html.is-fs body{background:var(--stage)}
html.is-fs .viewport{padding:0}
html.is-fs .stage{border-radius:0;box-shadow:none}

.el{position:absolute;z-index:2;transition:opacity .2s ease}
.lines{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;z-index:1}

/* Encabezado */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.title{font-family:var(--serif);font-weight:400;font-size:54px;line-height:1;letter-spacing:-.012em;margin:0}
.title em{font-style:italic;color:var(--voz)}
.tools{display:flex;justify-content:flex-end}
.fs{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 18px 0 14px;border-radius:999px;background:var(--ink);color:#FFFFFF;font-size:15px;font-weight:600;box-shadow:0 10px 20px -12px rgba(20,33,58,.6);transition:transform .15s, background .15s}
.fs:hover{background:#22314F;transform:translateY(-1px)}
.fs svg{width:19px;height:19px}
.hint{font-size:14px;color:var(--ink-3);text-align:right}
.hint kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper);color:var(--ink-2)}

/* El libro (obra escrita) y la ficción */
.page{position:absolute;width:1100px;height:700px;border-radius:20px;background:var(--paper);border:1px solid var(--edge);z-index:0}
.page.p3{left:266px;top:156px;border-color:#E2E6EC}
.page.p2{left:258px;top:148px;border-color:#DCE1E9}
.page.p1{left:250px;top:140px;box-shadow:0 22px 44px -26px rgba(20,33,58,.4)}
.fic{position:absolute;left:268px;top:158px;width:1064px;height:664px;border-radius:13px;z-index:0;
  background-color:var(--fic);background-image:radial-gradient(var(--fic-dot) 1.1px, transparent 1.6px);background-size:22px 22px}
.tab{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 15px;border-radius:999px;background:var(--paper);border:1.5px solid var(--real-edge);--c:var(--real);transition:border-color .15s}
.tab:hover{border-color:var(--real)}
.tab b{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--real)}
.tab span{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-3)}
.plano{display:grid;gap:1px;--c:var(--plano)}
.plano b{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--plano)}
.plano span{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-3)}
.plano:hover b{text-decoration:underline;text-underline-offset:3px}

/* Nodos */
.node{
  display:flex;align-items:center;gap:14px;padding:0 18px;
  border-radius:18px;background:var(--paper);border:1px solid var(--edge);
  box-shadow:0 1px 0 rgba(20,33,58,.03), 0 14px 28px -18px rgba(20,33,58,.45);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s, opacity .2s;
  --c:var(--voz);
}
.node:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 1px 0 rgba(20,33,58,.03), 0 20px 34px -18px rgba(20,33,58,.5)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--voz-tint);color:var(--voz)}
.ic svg{width:24px;height:24px}
.nm{display:block;font-family:var(--serif);font-size:26px;line-height:1;letter-spacing:-.005em}
.sb{display:block;font-size:13.5px;color:var(--ink-3);margin-top:5px;line-height:1.2}
.node.hero{background:linear-gradient(160deg,#2667B2,#1B4F8B);border-color:transparent;color:#FFFFFF;box-shadow:0 1px 0 rgba(20,33,58,.03), 0 22px 40px -18px rgba(31,95,166,.75)}
.node.hero .ic{background:rgba(255,255,255,.15);color:#FFFFFF;width:52px;height:52px}
.node.hero .nm{font-size:34px}
.node.hero .sb{color:rgba(255,255,255,.8)}
.node.dark{background:var(--ink);border-color:var(--ink);color:#FFFFFF;border-radius:999px;padding:0 26px 0 10px;--c:var(--ink)}
.node.dark .ic{background:rgba(255,255,255,.12);color:#FFFFFF;border-radius:999px;width:36px;height:36px}
.node.dark .ic svg{width:20px;height:20px}
.node.dark .nm{font-size:27px}
.node.dark .sb{color:rgba(255,255,255,.68);margin-top:2px;font-size:13px}
.person{display:grid;justify-items:center;align-content:center;gap:0;text-align:center;border-radius:20px;background:var(--paper);border:1px solid var(--real-edge);box-shadow:0 14px 28px -18px rgba(20,33,58,.4);transition:transform .16s, border-color .16s, opacity .2s;--c:var(--real)}
.person:hover{transform:translateY(-3px);border-color:var(--real)}
.person .ic{width:52px;height:52px;border-radius:16px;background:var(--real-tint);color:var(--real);margin-bottom:12px}
.person .nm{font-size:25px}
.person .sb{margin-top:6px}
.badge{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--paper);font-size:22px;font-weight:600;line-height:1;transition:transform .15s}
.badge:hover{transform:scale(1.08)}
.badge-neq{border:1.5px solid var(--ink-3);color:var(--plano);--c:var(--plano)}
.badge-id{border:1.5px dashed var(--lazo);color:var(--lazo);--c:var(--lazo)}

/* Tarjetas de categoría */
.cat{background:var(--paper);border-radius:18px;box-shadow:0 14px 28px -20px rgba(20,33,58,.45);transition:opacity .2s}
.cat-voz{border:1.5px solid var(--voz);--c:var(--voz);--t:var(--voz-tint);padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.cat-tm{border:1px solid var(--edge);display:grid;grid-template-columns:1fr 1fr}
.cat-tm::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 1px);width:2px;background:var(--line);pointer-events:none}
.half{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.cat-hist{border:1px solid var(--edge);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;--c:var(--ink);--t:var(--neutral-tint)}
.c-tiempo{--c:var(--tiempo);--t:var(--tiempo-tint)}
.c-modo{--c:var(--modo);--t:var(--modo-tint)}
.cat-head{display:flex;align-items:baseline;gap:10px;align-self:flex-start}
.cat-name{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.cat-name svg{width:17px;height:17px;transform:translateY(2px)}
.cat-q{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-2)}
.cat-head:hover .cat-name{text-decoration:underline;text-underline-offset:3px}
.hist-head{display:flex;align-items:center;gap:12px;align-self:flex-start}
.hist-head .ic{width:38px;height:38px;border-radius:11px;background:var(--neutral-tint);color:var(--ink)}
.hist-head .ic svg{width:21px;height:21px}
.hist-head .nm{font-size:26px}
.hist-head .sb{margin-top:3px}
.hist-head:hover .nm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.chips{display:flex;flex-wrap:nowrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--t);color:var(--c);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s,opacity .2s}
.chip:hover{background:var(--c);color:#FFFFFF}
.chip svg{width:15px;height:15px}
.lbl{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-3);text-align:center;pointer-events:none}
.src{font-size:12.5px;color:var(--ink-3)}

/* Enfoque: al abrir una ficha, lo no relacionado se atenúa */
.stage.focus .dim{opacity:.28}
.is-active{outline:3px solid var(--c, var(--voz));outline-offset:4px}
.is-rel{outline:2px dashed var(--c, var(--voz));outline-offset:4px}

/* Ficha */
.pop{
  position:fixed;z-index:50;left:0;top:0;
  width:min(470px, calc(100vw - 24px));
  max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain;
  background:#FFFFFF;border-radius:20px;
  box-shadow:0 0 0 1px rgba(20,33,58,.08), 0 34px 80px -18px rgba(20,33,58,.5);
  font-family:var(--sans);color:var(--ink);
  animation:popin .16s ease-out;
}
.pop:focus{outline:none}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.node,.person,.el,.cat,.chip{transition:none}}
.pop-h{position:relative;padding:20px 60px 18px 26px;background:var(--pt);border-radius:20px 20px 0 0}
.pop-k{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pc)}
.pop-k::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--pc)}
.pop h3{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;letter-spacing:-.01em}
.pop .q{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.2;color:var(--pc)}
.pop-b{padding:18px 26px 4px;display:grid;gap:16px}
.pop-b p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.pop-b i{font-style:italic}
.pop .sl{font-size:11px;line-height:1.3;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.pop ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.pop li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.pop li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc);margin-top:.55em}
.pop li b{color:var(--ink);font-weight:700}
.box{border-radius:14px;padding:12px 14px 13px}
.box p{font-size:14.5px;line-height:1.5}
.box-ex{background:#F4F6FA}
.box-ojo{background:#FDF6F5;border:1.5px dashed #E4B9B3}
.pop .box-ojo .sl{color:var(--plano)}
.formula{justify-self:start;font-family:var(--serif);font-size:24px;color:var(--pc);background:var(--pt);padding:4px 14px;border-radius:10px}
.pop-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 26px 20px;margin-top:14px;border-top:1px solid var(--hair)}
.pop-f .vt{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.go{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;border:1px solid #D3DAE5;font-size:13px;font-weight:600;color:var(--ink-2);background:#FFFFFF;transition:border-color .15s, background .15s}
.go:hover{border-color:var(--pc);background:var(--pt);color:var(--ink)}
.go::after{content:"→";font-weight:500;color:var(--ink-3)}
.ref{flex-basis:100%;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.ref i{font-style:italic}
.pop .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.75)}
.pop .x:hover{background:#FFFFFF;color:var(--ink)}
.pop .x svg{width:18px;height:18px}
.tip{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:var(--tipc, #FFFFFF);z-index:-1}
.pop[data-side="below"] .tip{top:-8px}
.pop[data-side="above"] .tip{bottom:-8px}
.pop[data-side="right"] .tip{left:-8px}
.pop[data-side="left"] .tip{right:-8px}
.pop[data-side="center"] .tip{display:none}

/* Visualizaciones dentro de las fichas */
.viz{background:#F5F7FA;border-radius:14px;padding:14px}
.viz svg{display:block;width:100%;height:auto}
.pop .viz-cap{font-size:12px;line-height:1.4;color:var(--ink-3);margin:10px 0 0}
.cuadro{display:grid;grid-template-columns:110px minmax(0,1fr);gap:0;font-size:14.5px}
.cuadro dt,.cuadro dd{padding:9px 0;border-bottom:1px solid var(--hair);margin:0}
.cuadro dt{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding-top:12px}
.cuadro dd{color:var(--ink);line-height:1.45}
.cuadro dt:last-of-type,.cuadro dd:last-of-type{border-bottom:0}
.cuadro dd .go{margin:2px 4px 2px 0}
.cuadro .qq{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--pc);line-height:1.2}
.triad{display:grid;justify-items:center}
.tri-n{width:230px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;background:#FFFFFF;border:1px solid var(--edge);font-family:var(--serif);font-size:21px}
.tri-n small{font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.tri-n.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.tri-n.on small{color:rgba(255,255,255,.7)}
.tri-r{position:relative;height:30px;width:2px;background:var(--line)}
.tri-r span{position:absolute;left:12px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center;background:#FFFFFF;border-radius:10px;padding:9px 11px}
.bar-row b{display:block;font-size:14px}
.bar-row .mono{display:block;font-family:var(--mono);font-size:11.5px;color:var(--tiempo);margin-top:1px}
.bar-row em{display:block;font-family:var(--serif);font-size:15px;color:var(--ink-3)}
.bl{display:flex;align-items:center;gap:7px;height:13px}
.bl + .bl{margin-top:5px}
.bl small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:10px}
.bl i{display:block;height:8px;border-radius:4px;width:var(--w)}
.bl .h{background:var(--ink-3)} .bl .r{background:var(--tiempo)}
.bl i.z{width:8px;background:transparent;border:2px solid currentColor}
.bl .h.z{color:var(--ink-3)} .bl .r.z{color:var(--tiempo)}
.freq-row{display:grid;grid-template-columns:minmax(0,1fr) 46px 64px;gap:10px;align-items:center;background:#FFFFFF;border-radius:10px;padding:9px 11px}
.freq-row b{display:block;font-size:14px}
.freq-row span.e{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.mk{display:flex;gap:3px;height:9px}
.mk + .mk{margin-top:4px}
.mk i{display:block;width:9px;height:9px}
.mk .sq{background:var(--tiempo);border-radius:2px}
.mk .ci{background:var(--ink-3);border-radius:50%}
.fr{font-family:var(--mono);font-size:12.5px;color:var(--tiempo);text-align:right}
.rail{position:relative;display:grid;gap:10px;padding-left:24px}
.rail::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(var(--modo-tint),var(--modo))}
.rail div{position:relative;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.rail div::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:#FFFFFF;border:2.5px solid var(--modo)}
.rail b{color:var(--ink);font-size:14px}
.rail small{font-family:var(--mono);font-size:11px;color:var(--modo);margin-left:6px}
.rail-ends{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.foc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.foc div{background:#FFFFFF;border-radius:10px;padding:10px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.foc svg{width:72px;height:54px;margin-bottom:4px}
.foc b{display:block;font-size:14px;color:var(--ink)}
.lv{border:1.5px solid var(--voz);border-radius:12px;padding:9px 11px 11px;background:#FFFFFF}
.lv .lv{margin-top:8px;background:var(--voz-tint)}
.lv .lv .lv{background:#CFE0F3}
.lv b{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--voz)}
.lv span{display:block;font-size:13px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th,.tbl td{padding:8px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--hair)}
.tbl thead th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tbl tbody th{color:var(--voz);font-weight:700;white-space:nowrap}
.tbl td{color:var(--ink-2);background:#FFFFFF}
.tbl td b{color:var(--ink)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}

.toast{position:fixed;left:50%;bottom:max(18px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#FFFFFF;font-size:14px;line-height:1.4;padding:11px 18px;border-radius:14px;max-width:min(560px, calc(100vw - 32px));text-align:center;box-shadow:0 16px 40px -16px rgba(20,33,58,.6)}
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">

  <!-- El libro: la obra escrita -->
  <div class="page p3"></div>
  <div class="page p2"></div>
  <div class="page p1"></div>
  <div class="fic"></div>

  <svg class="lines" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <marker id="a-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#14213A"/></marker>

<script>
const COL = {
  voz:["var(--voz)","var(--voz-tint)"], tiempo:["var(--tiempo)","var(--tiempo-tint)"], modo:["var(--modo)","var(--modo-tint)"],
  ink:["var(--ink)","var(--neutral-tint)"], real:["var(--real)","var(--real-tint)"], lazo:["var(--lazo)","var(--lazo-tint)"], plano:["var(--plano)","var(--plano-tint)"]
};

/* ---------- Visualizaciones de las fichas (inspiradas en los cuadros de la guía) ---------- */
const VIZ = {
  triad(active){
    const N = [["narracion","Narración","el acto"],["relato","Relato","el texto"],["historia","Historia","lo contado"]];
    const R = [["voz","var(--voz)"],["tiempo · modo","var(--tiempo)"]];
    let h = '<div class="triad">';
    N.forEach(([k,n,s],i) => {
      h += `<button type="button" class="tri-n${k===active?" on":""}" data-go="${k}"${k===active?' aria-current="true"':""}>${n} <small>${s}</small></button>`;
      if (i < 2) h += `<div class="tri-r"><span style="color:${R[i][1]}">${R[i][0]}</span></div>`;
    });
    return h + "</div>";
  },
  cuadro(rows){
    return '<dl class="cuadro">' + rows.map(([dt,dd]) => {
      let v;
      if (Array.isArray(dd)) v = dd.map(k => `<button type="button" class="go" data-go="${k}">${fmt(INFO[k].t)}</button>`).join("");
      else if (dd.startsWith("?")) v = `<span class="qq">${fmt(dd.slice(1))}</span>`;
      else v = fmt(dd);
      return `<dt>${fmt(dt)}</dt><dd>${v}</dd>`;
    }).join("") + "</dl>";
  },
  orden(){
    return `<svg viewBox="0 0 520 200" role="img" aria-label="Una analepsis salta hacia atrás desde el presente del relato; una prolepsis, hacia adelante. El alcance es la distancia del salto; la amplitud, el tramo que abarca.">
      <defs><marker id="vo-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6B44B6"/></marker>
      <marker id="vo-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#465470"/></marker></defs>
      <line x1="14" y1="118" x2="504" y2="118" stroke="#7C879B" stroke-width="1.5" marker-end="url(#vo-g)"/>
      <line x1="210" y1="118" x2="440" y2="118" stroke="#14213A" stroke-width="7" stroke-linecap="round"/>
      <line x1="78" y1="118" x2="134" y2="118" stroke="#6B44B6" stroke-width="7" stroke-linecap="round"/>
      <path d="M366 110 C330 14 116 14 82 106" fill="none" stroke="#6B44B6" stroke-width="2.4" marker-end="url(#vo-t)"/>
      <path d="M374 110 C392 58 450 58 468 106" fill="none" stroke="#6B44B6" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#vo-t)"/>
      <circle cx="370" cy="118" r="7" fill="#FFFFFF" stroke="#14213A" stroke-width="2.4"/>
      <text x="224" y="32" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B44B6">analepsis</text>
      <text x="421" y="56" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B44B6">prolepsis</text>
      <text x="270" y="144" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213A">relato primero</text>
      <text x="372" y="144" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#465470">presente</text>
      <path d="M80 130 V136 H134 V130" fill="none" stroke="#6B44B6" stroke-width="1.4"/>
      <text x="107" y="154" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#6B44B6">amplitud</text>
      <line x1="84" y1="176" x2="366" y2="176" stroke="#465470" stroke-width="1.3" marker-start="url(#vo-g)" marker-end="url(#vo-g)"/>
      <line x1="80" y1="160" x2="80" y2="184" stroke="#7C879B" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="370" y1="152" x2="370" y2="184" stroke="#7C879B" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="225" y="170" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#465470">alcance</text>
      <text x="504" y="196" text-anchor="end" font-family="Hanken Grotesk, Arial, sans-serif" font-size="13" fill="#7C879B">tiempo de la historia →</text>
    </svg>`;
  },
  duracion(){
    const rows = [
      ["Pausa descriptiva","TR = n · TH = 0","lentitud absoluta","z","90%"],
      ["Escena","TR = TH","igualdad convencional","55%","55%"],
      ["Sumario","TR < TH","velocidad variable","92%","26%"],
      ["Elipsis","TR = 0 · TH = n","velocidad infinita","92%","z"]];
    const bar = (cls,w) => w==="z" ? `<i class="${cls} z"></i>` : `<i class="${cls}" style="--w:${w}"></i>`;
    return '<div class="bars">' + rows.map(([n,f,v,h,r]) =>
      `<div class="bar-row"><div><b>${n}</b><span class="mono">${fmt(f)}</span><em>${v}</em></div><div><div class="bl"><small>H</small>${bar("h",h)}</div><div class="bl"><small>R</small>${bar("r",r)}</div></div></div>`).join("")
      + '</div><p class="viz-cap">H = tiempo de la historia · R = tiempo del relato (longitud del texto)</p>';
  },
  frecuencia(){
    const sq = n => '<i class="sq"></i>'.repeat(n), ci = n => '<i class="ci"></i>'.repeat(n);
    const rows = [
      ["Singulativo","«Ayer me acosté temprano.»",1,1,"1R / 1H"],
      ["Singulativo anafórico","«El lunes…, el martes…»",3,3,"nR / nH"],
      ["Repetitivo","*La celosía*, *Rashomon*",3,1,"nR / 1H"],
      ["Iterativo","«todos los días…»; Combray",1,3,"1R / nH"]];
    return '<div class="bars">' + rows.map(([n,e,r,h,f]) =>
      `<div class="freq-row"><div><b>${n}</b><span class="e">${fmt(e)}</span></div><div><div class="mk">${sq(r)}</div><div class="mk">${ci(h)}</div></div><div class="fr">${f}</div></div>`).join("")
      + '</div><p class="viz-cap">■ enunciado en el relato · ● acontecimiento en la historia</p>';
  },
  distancia(){
    const s = [["Narrativizado","máxima","las palabras se cuentan como un hecho más"],["Transpuesto","intermedia","estilo indirecto: el narrador condensa e interpreta"],["Indirecto libre","intermedia","sin subordinación, el discurso se emancipa"],["Restituido","mínima","estilo directo: se cede la palabra al personaje"],["Inmediato","límite","«monólogo interior», sin marco del narrador"]];
    return '<div class="rail-ends"><span>Más distancia · contar</span></div><div class="rail">' + s.map(([n,l,d]) => `<div><b>${n}</b><small>${l}</small><br>${d}</div>`).join("") + '</div><div class="rail-ends" style="margin:10px 0 0"><span>Menos distancia · mostrar</span></div>';
  },
  focal(){
    const eye = (x,y) => `<path d="M${x-9} ${y} Q${x} ${y-7} ${x+9} ${y} Q${x} ${y+7} ${x-9} ${y} Z" fill="#FFFFFF" stroke="#0C7A70" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="2.8" fill="#0C7A70"/>`;
    const fig = (x,y,c) => `<circle cx="${x}" cy="${y}" r="5" fill="#14213A"/><path d="M${x-7} ${y+16} C${x-7} ${y+8} ${x-4} ${y+6} ${x} ${y+6} C${x+4} ${y+6} ${x+7} ${y+8} ${x+7} ${y+16} Z" fill="${c}"/>`;
    const a = `<svg viewBox="0 0 72 54" aria-hidden="true"><path d="M36 13 L16 34 M36 13 L56 34" stroke="#0C7A70" stroke-width="1.2" stroke-dasharray="2 3"/>${eye(36,9)}${fig(16,36,"#465470")}${fig(56,36,"#465470")}<circle cx="24" cy="28" r="2" fill="#0C7A70"/><circle cx="64" cy="28" r="2" fill="#0C7A70"/></svg>`;
    const b = `<svg viewBox="0 0 72 54" aria-hidden="true"><path d="M22 24 L66 12 M22 24 L68 28 M22 24 L66 44" stroke="#0C7A70" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="18" cy="24" r="8" fill="#14213A"/><path d="M13 24 Q18 20 23 24 Q18 28 13 24 Z" fill="#FFFFFF"/><circle cx="18" cy="24" r="1.8" fill="#0C7A70"/><path d="M7 52 C7 40 11 35 18 35 C25 35 29 40 29 52 Z" fill="#0C7A70"/>${fig(58,34,"#7C879B")}</svg>`;
    const c = `<svg viewBox="0 0 72 54" aria-hidden="true"><path d="M17 26 L44 22 M17 26 L44 42" stroke="#0C7A70" stroke-width="1.2" stroke-dasharray="2 3"/>${eye(10,26)}<circle cx="54" cy="20" r="8" fill="#14213A"/><path d="M43 52 C43 36 47 31 54 31 C61 31 65 36 65 52 Z" fill="#465470"/></svg>`;
    return `<div class="foc"><div>${a}<b>Cero</b>el narrador no se limita al saber de ningún personaje</div><div>${b}<b>Interna</b>fija, variable o múltiple: pasa por uno o varios personajes</div><div>${c}<b>Externa</b>vemos actuar al héroe sin acceso a lo que piensa</div></div>`;
  },
  tnarr(){

/* ---------- Escalado, fichas y pantalla completa ---------- */
const stage = document.getElementById("stage");
const vp = document.querySelector(".viewport");
const pop = document.getElementById("pop");
const tip = document.getElementById("popTip");
const toastEl = document.getElementById("toast");
let current = null, toastTimer = null;

function fit(){
  const cs = getComputedStyle(vp);
  const w = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  stage.style.setProperty("--s", Math.max(.1, Math.min(w / 1600, h / 900)));
  if (current) place(current);
}

function fmt(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*(.+?)\*/g,"<i>$1</i>"); }
function list(items){ return "<ul>" + items.map(([a,b]) => `<li><span><b>${fmt(a)}:</b> ${fmt(b)}</span></li>`).join("") + "</ul>"; }

function fill(k){
  const d = INFO[k], [pc, pt] = COL[d.c];
  pop.style.setProperty("--pc", pc);
  pop.style.setProperty("--pt", pt);
  document.getElementById("popK").textContent = d.k;
  document.getElementById("popT").textContent = d.t;
  const q = document.getElementById("popQ");
  q.hidden = !d.q; q.textContent = d.q || "";
  let h = "";
  if (d.f) h += `<div class="formula">${fmt(d.f)}</div>`;
  if (d.p && d.v && d.v[0] === "cuadro") h += `<div class="viz">${VIZ.cuadro(d.v[1])}</div><p>${fmt(d.p)}</p>`;
  else {
    if (d.p) h += `<p>${fmt(d.p)}</p>`;
    if (d.v) h += `<div class="viz">${VIZ[d.v[0]](...d.v.slice(1))}</div>`;
  }
  if (d.l) h += "<div>" + (d.ls ? `<p class="sl">${fmt(d.ls)}</p>` : "") + list(d.l) + "</div>";
  if (d.ej) h += `<div class="box box-ex"><p class="sl">En Genette</p><p>${fmt(d.ej)}</p></div>`;
  if (d.ojo) h += `<div class="box box-ojo"><p class="sl">No confundir</p><p>${fmt(d.ojo)}</p></div>`;
  document.getElementById("popB").innerHTML = h;
  let f = "";
  const rel = (d.rel || []).filter(x => INFO[x]);
  if (rel.length) f += `<span class="vt">Relacionado</span>` + rel.map(x => `<button type="button" class="go" data-go="${x}">${fmt(INFO[x].t)}</button>`).join("");
  if (d.r) f += `<span class="ref"><i>Figuras III</i>, ${fmt(d.r)}</span>`;
  const foot = document.getElementById("popF");
  foot.innerHTML = f; foot.hidden = !f;
}

function relatedKeys(k){
  const d = INFO[k], s = new Set([k, ...(d.rel || [])]);
  if (d.v && d.v[0] === "cuadro") d.v[1].forEach(([,dd]) => Array.isArray(dd) && dd.forEach(x => s.add(x)));
  return s;
}

function focus(k){
  const keep = relatedKeys(k);
  stage.classList.add("focus");
  stage.querySelectorAll(".is-rel").forEach(e => e.classList.remove("is-rel"));
  stage.querySelectorAll(".el").forEach(el => {
    if (el.matches(".eyebrow,.title,.tools,.hint,.src")) return;
    const own = el.dataset.k ? [el] : [];
    const kids = [...el.querySelectorAll("[data-k]")];
    const all = own.concat(kids);
    const hit = all.some(x => keep.has(x.dataset.k));
    el.classList.toggle("dim", !hit);
    kids.forEach(x => x.classList.toggle("dim", hit && !keep.has(x.dataset.k)));
  });
  keep.forEach(x => { if (x !== k) { const a = anchorFor(x); if (a) a.classList.add("is-rel"); } });
}
function unfocus(){
  stage.classList.remove("focus");
  stage.querySelectorAll(".dim,.is-rel").forEach(e => e.classList.remove("dim","is-rel"));
}

function anchorFor(k){ return stage.querySelector(`[data-k="${k}"]`); }

function place(btn){
  const r = btn.getBoundingClientRect();
  const m = 12, gap = 16, vw = innerWidth, vh = innerHeight;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const cy = r.top + r.height / 2, cx = r.left + r.width / 2;
  let left, top, side;
  if (r.right + gap + pw <= vw - m) { side = "right"; left = r.right + gap; }
  else if (r.left - gap - pw >= m) { side = "left"; left = r.left - gap - pw; }
  else if (r.bottom + gap + ph <= vh - m) { side = "below"; top = r.bottom + gap; }
  else if (r.top - gap - ph >= m) { side = "above"; top = r.top - gap - ph; }
  else side = "center";
  if (side === "right" || side === "left") {
    top = Math.max(m, Math.min(cy - Math.min(ph / 2, 120), vh - m - ph));
    const ty = Math.max(18, Math.min(cy - top - 8, ph - 34));
    tip.style.top = ty + "px"; tip.style.left = "";
    pop.style.setProperty("--tipc", ty < document.getElementById("popH").offsetHeight - 10 ? "var(--pt)" : "#FFFFFF");
  } else if (side === "below" || side === "above") {
    left = Math.max(m, Math.min(cx - pw / 2, vw - m - pw));
    tip.style.left = Math.max(20, Math.min(cx - left - 8, pw - 36)) + "px"; tip.style.top = "";
    pop.style.setProperty("--tipc", side === "below" ? "var(--pt)" : "#FFFFFF");
  } else {
    left = (vw - pw) / 2; top = Math.max(m, (vh - ph) / 2);
  }
  pop.dataset.side = side;
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}

function openPop(btn){
  if (!btn) return;
  const k = btn.dataset.k;
  if (!INFO[k]) return;
  if (current) { current.classList.remove("is-active"); current.setAttribute("aria-expanded","false"); }
  current = btn;
  fill(k);
  focus(k);
  pop.hidden = false;
  pop.scrollTop = 0;
  pop.style.animation = "none"; void pop.offsetWidth; pop.style.animation = "";
  place(btn);
  btn.classList.add("is-active");
  btn.setAttribute("aria-expanded","true");
  pop.focus({preventScroll:true});
}

function closePop(returnFocus){
  if (!current) return;
  const btn = current;
  current = null;
  pop.hidden = true;
  unfocus();
  btn.classList.remove("is-active");
  btn.setAttribute("aria-expanded","false");
  if (returnFocus) btn.focus({preventScroll:true});
}

function toast(msg){
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 5200);
}

const fsBtn = document.getElementById("fsBtn");
const fsLabel = document.getElementById("fsLabel");
const fsIcon = document.getElementById("fsIcon");
const ICON_IN = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const ICON_OUT = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function toggleFS(){
  const root = document.documentElement;
  if (fsElement()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!req || !enabled) { toast("Este visor no permite pantalla completa. Abre la lámina en su propia pestaña: cifuac.github.io/mapa-narrativo-genette"); return; }
  try {
    const p = req.call(root);
    if (p && p.catch) p.catch(() => toast("El navegador no permitió la pantalla completa. Abre la lámina en su propia pestaña e inténtalo de nuevo."));
  } catch (e) { toast("El navegador no permitió la pantalla completa."); }
}
function onFS(){
  const on = !!fsElement();
  document.documentElement.classList.toggle("is-fs", on);
  fsLabel.textContent = on ? "Salir de pantalla completa" : "Pantalla completa";
  fsIcon.innerHTML = on ? ICON_OUT : ICON_IN;
  fsBtn.setAttribute("aria-pressed", String(on));
  requestAnimationFrame(fit);
}
fsBtn.addEventListener("click", e => { e.stopPropagation(); toggleFS(); });
document.addEventListener("fullscreenchange", onFS);
document.addEventListener("webkitfullscreenchange", onFS);

document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-expanded","false"));
document.addEventListener("click", e => {
  if (e.target.closest("#fsBtn")) return;
  const go = e.target.closest("[data-go]");
  if (go) { const a = anchorFor(go.dataset.go); if (a) openPop(a); return; }
  if (e.target.closest("#popX")) { closePop(true); return; }
  const b = e.target.closest("[data-k]");
  if (b) { if (current === b) closePop(false); else openPop(b); return; }
  if (!pop.contains(e.target)) closePop(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePop(true); return; }
  if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); toggleFS(); }
});
addEventListener("resize", fit);
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) place(current); });
</script>
</body>
</html>
